<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Cloud</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #171717;
        background: #fafafa;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 14px;
        color: #737373;
        font-size: 12px;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: #525252;
        margin-bottom: 6px;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 10px;
        background: #171717;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.secondary {
        background: #fff;
        color: #171717;
        border: 1px solid #e5e5e5;
      }
      button:hover {
        opacity: 0.92;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
        display: none;
      }
      #status.show {
        display: block;
      }
      #status.info {
        background: #f5f5f5;
        color: #525252;
      }
      #status.ok {
        background: #ecfdf5;
        color: #047857;
      }
      #status.err {
        background: #fef2f2;
        color: #b91c1c;
      }
      a.settings {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: #525252;
      }
      .hint {
        font-size: 11px;
        color: #737373;
        margin-bottom: 10px;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      .meta {
        font-size: 13px;
        color: #404040;
        margin-bottom: 14px;
        padding: 10px;
        background: #fff;
        border-radius: 10px;
        border: 1px solid #eee;
      }
      .meta strong {
        display: block;
        font-size: 15px;
        color: #171717;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Recipe Builder</h1>
    <p id="backend-hint" class="hint"></p>

    <div id="view-no-active" class="view">
      <p class="sub">Create a new recipe from this page, or start building from scratch.</p>
      <label for="recipe-name">Recipe name (optional)</label>
      <input type="text" id="recipe-name" placeholder="e.g. Bun Bo Hue" maxlength="120" />
      <button type="button" id="btn-save-new">Save this page</button>
    </div>

    <div id="view-active" class="view">
      <div class="meta">
        <strong id="active-title">Recipe</strong>
        <span id="active-sources">0 sources</span>
      </div>
      <button type="button" id="btn-add-page">Add this page to recipe</button>
      <button type="button" class="secondary" id="btn-create-new">Create new recipe</button>
    </div>

    <div id="view-success" class="view">
      <p class="sub" id="success-msg">Added to your recipe.</p>
      <button type="button" id="btn-view-recipe">View recipe</button>
      <button type="button" class="secondary" id="btn-continue-building">Add another page</button>
    </div>

    <div id="status" role="status"></div>
    <a href="#" id="open-options" class="settings">Extension settings (API URL)</a>
    <script src="popup.js"></script>
  </body>
</html>
