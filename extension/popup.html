<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Cloud</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #171717;
        background: #fafafa;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 600;
      }
      p {
        margin: 0 0 14px;
        color: #737373;
        font-size: 12px;
        line-height: 1.4;
      }
      button {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 10px;
        background: #171717;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #404040;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
        display: none;
      }
      #status.show {
        display: block;
      }
      #status.info {
        background: #f5f5f5;
        color: #525252;
      }
      #status.ok {
        background: #ecfdf5;
        color: #047857;
      }
      #status.err {
        background: #fef2f2;
        color: #b91c1c;
      }
      a.settings {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        color: #525252;
      }
      .hint {
        font-size: 11px;
        color: #737373;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Recipe Cloud</h1>
    <p id="backend-hint" class="hint"></p>
    <button type="button" id="save">Save recipe from this page</button>
    <div id="status" role="status"></div>
    <a href="#" id="open-options" class="settings">Extension settings (API URL)</a>
    <script src="popup.js"></script>
  </body>
</html>
