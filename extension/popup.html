<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Cloud</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px 16px 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #171717;
        background: #fafafa;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 18px;
        font-weight: 600;
      }
      .tagline {
        margin: 0 0 12px;
        font-size: 11px;
        color: #737373;
      }
      .hint {
        font-size: 10px;
        color: #a3a3a3;
        margin-bottom: 10px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #525252;
        margin: 10px 0 6px;
      }
      .choice {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 10px;
        margin-bottom: 4px;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        cursor: pointer;
        line-height: 1.35;
      }
      .choice:hover {
        border-color: #d4d4d4;
        background: #fafafa;
      }
      .choice input {
        margin-top: 2px;
        flex-shrink: 0;
      }
      .choice strong {
        color: #171717;
      }
      label[for="recipe-name"] {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: #525252;
        margin: 10px 0 4px;
      }
      #recipe-name {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-size: 13px;
      }
      button.primary {
        width: 100%;
        margin-top: 12px;
        padding: 11px 14px;
        border: none;
        border-radius: 10px;
        background: #171717;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:hover {
        background: #404040;
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 8px;
        font-size: 12px;
        display: none;
      }
      #status.show {
        display: block;
      }
      #status.err {
        background: #fef2f2;
        color: #b91c1c;
      }
      #status.info {
        background: #f5f5f5;
        color: #525252;
      }
      a.settings {
        display: block;
        margin-top: 10px;
        font-size: 11px;
        color: #737373;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      .success-check {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .success-title {
        font-weight: 600;
        font-size: 15px;
        color: #171717;
        margin-bottom: 4px;
      }
      .success-sub {
        font-size: 12px;
        color: #525252;
        margin-bottom: 14px;
      }
      button.secondary {
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 6px;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        background: #fff;
        color: #171717;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.secondary:hover {
        background: #f5f5f5;
      }
      #choices-loading {
        font-size: 12px;
        color: #737373;
        padding: 12px;
        text-align: center;
      }
      .diff-section {
        margin-top: 12px;
      }
      .diff-section h3 {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #525252;
        margin: 0 0 6px;
      }
      .diff-section ul {
        margin: 0;
        padding-left: 16px;
        font-size: 12px;
        color: #404040;
        line-height: 1.45;
      }
      .diff-section li {
        margin-bottom: 4px;
      }
      .diff-summary {
        font-size: 13px;
        color: #262626;
        line-height: 1.45;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <div id="view-main" class="view active">
      <h1>🍳 Recipe Cloud</h1>
      <p class="tagline">Recipe Builder — add this page to any recipe</p>
      <p id="backend-hint" class="hint"></p>

      <p class="section-title">Add this page to</p>
      <div id="choices-loading">Loading recipes…</div>
      <div id="choices" style="display: none"></div>

      <label for="recipe-name">New recipe name (only if creating new)</label>
      <input
        type="text"
        id="recipe-name"
        placeholder="e.g. Bun Bo Hue"
        maxlength="120"
      />

      <button type="button" class="primary" id="btn-submit">
        Add this page
      </button>
      <div id="status" role="status"></div>
      <a href="#" id="open-options" class="settings">Extension settings (API URL)</a>
    </div>

    <div id="view-diff" class="view">
      <p class="success-title">Recipe updated</p>
      <p class="diff-summary" id="diff-summary"></p>
      <div class="diff-section" id="diff-key-wrap">
        <h3 style="color: #166534">What improved</h3>
        <p style="font-size: 11px; color: #737373; margin: 4px 0 8px">
          Authenticity · technique · flavor
        </p>
        <ul id="diff-key-improvements"></ul>
      </div>
      <button type="button" class="primary" id="btn-diff-continue" style="margin-top: 14px">
        Continue
      </button>
    </div>

    <div id="view-success" class="view">
      <div class="success-check">✅</div>
      <p class="success-title" id="success-title">Added to recipe</p>
      <p class="success-sub" id="success-sub">
        Recipe updated with new source.
      </p>
      <button type="button" class="primary" id="btn-view-recipe">
        View recipe
      </button>
      <button type="button" class="secondary" id="btn-add-another">
        Add another source
      </button>
      <a href="#" id="open-options-2" class="settings">Extension settings</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
